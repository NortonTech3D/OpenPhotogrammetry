name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
          - os: windows-latest
            preset: windows-debug
          - os: macos-13
            preset: macos-debug
          - os: macos-14
            preset: apple-silicon-debug
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error

      - name: Acceptance criteria gate
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error -R "^(unit|integration|regression)\\."

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.os }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/**
          if-no-files-found: ignore

  quality-gates-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure ASan/UBSan
        run: cmake --preset linux-asan

      - name: Build ASan/UBSan
        run: cmake --build --preset linux-asan

      - name: Test ASan/UBSan
        run: ctest --preset linux-asan --output-on-failure --no-tests=error

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-linux-asan
          path: build/linux-asan/Testing/**
          if-no-files-found: ignore
